<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Флаг Италии">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8cbb8"/>
      <stop offset="1" stop-color="#aa8a69"/>
    </linearGradient>
    <clipPath id="flag"><rect x="200" y="50" width="1200" height="800" rx="14"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#3b2415" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="200" y="50" width="1200" height="800" rx="14" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#flag)">
    <rect x="200" y="50" width="400" height="800" fill="#009246"/>
    <rect x="600" y="50" width="400" height="800" fill="#fff"/>
    <rect x="1000" y="50" width="400" height="800" fill="#ce2b37"/>
  </g>
</svg>
