.structure-frame{display:inline-flex;max-width:100%;overflow-x:auto;overflow-y:hidden;align-items:center;vertical-align:middle;color:#163954;scrollbar-width:thin;scrollbar-color:#b3cad5 transparent;padding:2px 3px}
.structure-frame svg{max-width:none;flex:none;display:block}
.structure-frame.compact svg{height:auto;max-height:155px}
.option .structure-frame{width:100%;justify-content:flex-start}
.option .structure-frame svg{transform-origin:left center}
.chem-card{overflow:hidden}
.chem-card .structure-frame{max-width:100%;min-height:85px}
.flash .structure-frame{max-width:100%;color:#123b58}
.flash .structure-frame svg{max-height:210px}
.match-left .structure-frame{max-width:100%}
.match-left .structure-frame svg{max-height:145px}
.correct-list{display:grid;gap:8px}.correct-list>div{border-top:1px solid #dce8ef;padding-top:6px}.branch-explainer{margin-top:21px;border:1px solid #bddde2;background:#eef9f9;padding:18px;border-radius:14px;text-align:center}
.branch-explainer b{display:block;margin-bottom:6px}.branch-explainer p{text-align:left}.branch-explainer small{display:block;margin-top:8px;color:#486476}
.branch-explainer .structure-frame{justify-content:center;max-width:100%}
.branch-explainer .structure-frame svg{max-height:185px}
.bank-info{color:var(--muted);font-size:.8rem;margin-top:7px}
.new-set{font-size:.84rem}
.answer-preview{background:#f3f8fa;border:1px dashed #abc7d4;padding:8px;margin:11px 0;border-radius:12px;min-height:40px}
.answer-preview:empty{display:none}.mobile-scroll-tip{display:none}@media(max-width:750px){.mobile-scroll-tip{display:block}}
.answer-preview strong{font-size:.78rem;color:#557287;display:block;margin:4px 0 0}
@media(max-width:750px){.options{grid-template-columns:1fr}.match-row{grid-template-columns:1fr}.chem-card{padding:12px 8px}.option{padding:10px}.structure-frame svg{max-height:135px}.flash{padding:20px 10px}}

/* v5: Formula-choice cards: no intrinsic SVG width may expand the answer grid. */
.options.has-structures{grid-template-columns:minmax(0,1fr)}
.options .option{min-width:0;max-width:100%;width:100%}
.option>.option-content{display:block;min-width:0;max-width:100%;flex:1 1 0;overflow:hidden}
.option-content .structure-frame{display:flex;width:100%;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;justify-content:flex-start}
.option-content .structure-frame svg{flex:0 0 auto;max-width:none}
/* Match cards can contain the same large drawings. */
.match-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.match-left{min-width:0;max-width:100%;overflow:hidden}
.match-left .structure-frame{display:flex;width:100%;max-width:100%;min-width:0;overflow-x:auto;justify-content:flex-start}
.match-row select{min-width:0}
@media(max-width:750px){.match-row{grid-template-columns:minmax(0,1fr)}}

/* v6 — All structural drawings must remain fully visible. SVGs fit their
   container rather than exposing only the left edge behind a hidden scroll. */
.structure-frame,
.option-content .structure-frame,
.match-left .structure-frame,
.chem-card .structure-frame,
.flash .structure-frame,
.answer-preview .structure-frame,
.branch-explainer .structure-frame {
  display:inline-flex;
  vertical-align:middle;
  max-width:100%;
  min-width:0;
  width:auto;
  height:auto;
  overflow:visible;
  align-items:center;
  justify-content:center;
}
.structure-frame svg,
.option .structure-frame svg,
.option-content .structure-frame svg,
.match-left .structure-frame svg,
.chem-card .structure-frame svg,
.flash .structure-frame svg,
.answer-preview .structure-frame svg,
.branch-explainer .structure-frame svg {
  display:block;
  box-sizing:border-box;
  max-width:100%;
  min-width:0;
  width:auto;
  height:auto;
  flex:0 1 auto;
  transform:none;
}
.options.has-structures{grid-template-columns:minmax(0,1fr)}
.option, .option-content, .match-left, .match-row, .chem-card{min-width:0;max-width:100%}
.option>.option-content{overflow:visible;flex:1 1 0}
.match-left{overflow:visible}
.match-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.match-row select{min-width:0}
/* Show BOTH full structural formulae in homolog/isomer pair questions. */
.formula-wrap.formula-pair-structures{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  justify-items:stretch;
  width:100%;
  max-width:100%;
  gap:8px;
}
.formula-pair-structures .chem-card,
.single-structure .chem-card{
  width:100%;
  flex:1 1 auto;
  overflow:visible;
}
.formula-pair-structures .versus{justify-self:center;min-height:22px}
.formula-pair-structures .structure-frame{max-width:100%;}
/* For tiny screens, stack all matched formula rows rather than compressing. */
@media(max-width:850px){
  .match-row{grid-template-columns:minmax(0,1fr)}
  .match-left .structure-frame{max-width:100%}
}
@media(max-width:390px){
  .content-body{padding:18px 16px 23px}
  .content-head{padding:20px 16px 15px}
  .chem-card{padding:14px 8px}
}

<body>
<header class="site-head"><nav class="shell" aria-label="Навигация по сайту"><a class="site-home-link" href="index.html">← Кабинет учителя</a></nav><div class="shell head-row"><div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 8L22 7 27 19 16 27 5 20 9 8Z"/><path d="M9 8L16 16 27 19M16 16L16 27M16 16L22 7"/><circle cx="9" cy="8" r="2.6" fill="#95dfe4"/><circle cx="27" cy="19" r="2.6" fill="#95dfe4"/><circle cx="16" cy="27" r="2.6" fill="#95dfe4"/></svg></div><div><small>Химия • 10 класс</small><h1>Алифатические углеводороды</h1><div class="subline">Классификация · Гомологи · Изомеры · Номенклатура</div></div></div><div class="head-controls"><div class="switcher" role="tablist" aria-label="Режим работы"><button id="trainTab" type="button" role="tab" aria-selected="true">Тренировка</button><button id="examTab" type="button" role="tab" aria-selected="false">Контрольная</button></div></div></div></header>
<main class="shell main"><div id="overview" class="overview"></div><div class="workspace"><aside class="panel" id="sidebar"></aside><section class="panel" id="mainPanel" aria-live="polite"></section></div></main>
<footer class="footer">Автономный тренажёр · Работает без интернета · Прогресс сохраняется локально, если это разрешено браузером</footer>
<script>
'use strict';
// Весь банк заданий встроен в HTML. Интернет и сервер не требуются.
const CLASSES=['Алканы','Алкены','Алкины','Алкадиены'];
let autoId=0;
const question=(type,prompt,opts,answer,explain,more={})=>({id:'q'+(++autoId),type,prompt,options:opts||[],answer,explain,...more});
const single=(p,o,a,e,m)=>question('single',p,o,a,e,m);
const multi=(p,o,a,e,m)=>question('multiple',p,o,a,e,m);
const match=(p,rows,options,e)=>question('match',p,options,rows.map(x=>x[1]),e,{rows:rows.map(x=>x[0])});
const naming=(p,formula,answer,e,aliases=[])=>question('input-name',p,[],answer,e,{formula,aliases});
const struct=(p,name,formula,e)=>question('input-formula',p,[],formula,e,{name});
const stage=(name,description,questions)=>({kind:'quiz',name,description,questions});
const theoretical=(name,html)=>({kind:'theory',name,description:'Краткая теория и примеры',html,questions:[]});
const flashStage=(name,description,cards)=>({kind:'flash',name,description,cards,questions:[]});
const SUBSCRIPT={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function chem(s){return esc(s).replace(/\d/g,d=>SUBSCRIPT[d]).replace(/#/g,'≡').replace(/-/g,'–');}
function looksFormula(s){return /CH|C\(|C#|C≡|C=|H\d/i.test(s);}
function pretty(s){const v=String(s||'');return looksFormula(v)&&/^(?:CH[0-9]?|C|[-=#()])+$/i.test(v)?visualFormula(v,true):looksFormula(v)?`<span class="chem inline">${chem(v)}</span>`:esc(v);}
const formulaCard=(s,label='')=>`<div class="chem-card">${label?`<em>${esc(label)}</em>`:''}${visualFormula(s)}</div>`;
// Школьная развёрнутая запись: боковые группы рисуются вертикальными связями.
function drawStructure(raw, compact=false){
 const src=String(raw||'').toUpperCase().replace(/[₀-₉]/g,c=>String('₀₁₂₃₄₅₆₇₈₉'.indexOf(c))).replace(/[—–−]/g,'-').replace(/≡/g,'#').replace(/\s/g,'');
 const parts=src.match(/CH[0-9]?|C|[-=#()]/g)||[];
 if(parts.join('')!==src||!parts.length)return `<span class="chem">${chem(raw)}</span>`;
 const nodes=[],edges=[],stack=[],branchCount={},gap=93;let last=-1,pending=1,nextMain=0,isFirstBranch=false;
 const add=(label)=>{
  let x,y;
  if(isFirstBranch&&stack.length){const ctx=stack[stack.length-1],n=branchCount[ctx.parent]=(branchCount[ctx.parent]||0)+1;
   ctx.sign=n%2? -1:1;ctx.level=Math.ceil(n/2); x=nodes[ctx.parent].x; y=nodes[ctx.parent].y+ctx.sign*70*ctx.level;
  }else if(stack.length){const ctx=stack[stack.length-1]; x=last>=0?nodes[last].x+gap:nodes[ctx.parent].x; y=nodes[ctx.parent].y+ctx.sign*70*ctx.level;}
  else {x=nextMain++*gap;y=0;}
  const id=nodes.length;nodes.push({label,x,y});if(last>=0)edges.push({a:last,b:id,order:pending});last=id;pending=1;isFirstBranch=false;
 };
 for(const t of parts){
  if(t==='-'||t==='='||t==='#'){pending=t==='-'?1:t==='='?2:3;}
  else if(t==='('){stack.push({parent:last,sign:-1,level:1});isFirstBranch=true;pending=1;}
  else if(t===')'){if(!stack.length)return `<span class="chem">${chem(raw)}</span>`;last=stack.pop().parent;isFirstBranch=false;}
  else add(t);
 }
 if(stack.length)return `<span class="chem">${chem(raw)}</span>`;
 const minX=Math.min(...nodes.map(n=>n.x)),maxX=Math.max(...nodes.map(n=>n.x));
 const minY=Math.min(...nodes.map(n=>n.y)),maxY=Math.max(...nodes.map(n=>n.y));
 const marginX=38,marginY=34,width=maxX-minX+2*marginX,height=maxY-minY+2*marginY;
 const bonds=edges.map(e=>{
  const a=nodes[e.a],b=nodes[e.b],vx=b.x-a.x,vy=b.y-a.y,L=Math.hypot(vx,vy)||1,ux=vx/L,uy=vy/L,nx=-uy,ny=ux;
  const padX=Math.abs(ux)>0.6?27:19;const ax=a.x+ux*padX,ay=a.y+uy*padX,bx=b.x-ux*padX,by=b.y-uy*padX;
  const offsets=e.order===1?[0]:e.order===2?[-3.4,3.4]:[-5.2,0,5.2];
  return offsets.map(off=>`<line x1="${(ax+nx*off-minX+marginX).toFixed(1)}" y1="${(ay+ny*off-minY+marginY).toFixed(1)}" x2="${(bx+nx*off-minX+marginX).toFixed(1)}" y2="${(by+ny*off-minY+marginY).toFixed(1)}"/>`).join('');
 }).join('');
 const atoms=nodes.map(n=>`<text x="${n.x-minX+marginX}" y="${n.y-minY+marginY}" text-anchor="middle" dominant-baseline="central">${esc(n.label).replace(/\d/g,d=>SUBSCRIPT[d])}</text>`).join('');
 const ratio=compact?' compact':'';
 return `<span class="structure-frame${ratio}" title="${esc(raw)}"><svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Структурная формула: ${esc(raw)}"><g stroke="currentColor" stroke-width="2.3" stroke-linecap="round">${bonds}</g><g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="currentColor">${atoms}</g></svg></span>`;
}
function visualFormula(s,compact=true){return drawStructure(s,compact);}
const nameAlternatives={
 'бутен-1':['1-бутен','бутен-1'], 'бутен-2':['2-бутен','бутен-2'], 'пентен-1':['1-пентен','пентен-1'], 'пентен-2':['2-пентен','пентен-2'],
 'бутин-1':['1-бутин','бутин-1'], 'бутин-2':['2-бутин','бутин-2'], 'пентин-1':['1-пентин','пентин-1'], 'гексен-2':['2-гексен','гексен-2'],
 'бутадиен-1,3':['1,3-бутадиен','бутадиен-1,3','дивинил'], 'пентадиен-1,3':['1,3-пентадиен','пентадиен-1,3'],
 '2-метилпропан':['изобутан'], '2-метилбутан':['изопентан'], '2,2-диметилпропан':['неопентан'], 'этин':['ацетилен'], 'этен':['этилен'],
 '2-метилбутадиен-1,3':['изопрен','2-метил-1,3-бутадиен']
};
const theoryClass=`<div class="theory"><p>Алифатические углеводороды — соединения углерода и водорода, не содержащие ароматического кольца. В этом тренажёре рассматриваются <b>ациклические</b> (с открытой цепью) углеводороды.</p><table class="theory-table"><thead><tr><th>Класс</th><th>Отличительный признак</th><th>Общая формула*</th><th>Пример</th></tr></thead><tbody><tr><td><b>Алканы</b></td><td>Только одинарные связи C–C</td><td>CₙH₂ₙ₊₂</td><td><span class="chem">CH₃–CH₂–CH₃</span></td></tr><tr><td><b>Алкены</b></td><td>Одна двойная связь C=C</td><td>CₙH₂ₙ</td><td><span class="chem">CH₂=CH–CH₃</span></td></tr><tr><td><b>Алкины</b></td><td>Одна тройная связь C≡C</td><td>CₙH₂ₙ₋₂</td><td><span class="chem">CH≡C–CH₃</span></td></tr><tr><td><b>Алкадиены</b></td><td>Две двойные связи C=C</td><td>CₙH₂ₙ₋₂</td><td><span class="chem">CH₂=CH–CH=CH₂</span></td></tr></tbody></table><p style="color:var(--muted);font-size:.82rem">* Формулы приведены для ациклических соединений указанных классов.</p><div class="note"><b>Важно!</b> Алкины и алкадиены имеют одинаковую общую молекулярную формулу CₙH₂ₙ₋₂. Отличить их только по составу нельзя: необходимо видеть связи между атомами.</div><h3>Алгоритм</h3><ol><li>Посмотрите, какие связи соединяют атомы углерода.</li><li>Если все C–C одинарные — <b>алкан</b>.</li><li>Если одна C=C — <b>алкен</b>.</li><li>Если одна C≡C — <b>алкин</b>.</li><li>Если две C=C — <b>алкадиен</b>.</li></ol><div class="keybox">Разветвление углеродной цепи само по себе не меняет класс соединения. Например, 2-метилпропан — алкан.</div></div>`;
const theoryHom=`<div class="theory"><p><b>Гомологи</b> — вещества одного гомологического ряда, сходные по строению и химическим свойствам, состав которых отличается на одну или несколько групп –CH₂–.</p><div class="keybox"><b>Главный критерий:</b> вещества должны относиться к <b>одному классу</b> и различаться по числу атомов углерода. У соединений одного ряда разность молекулярных формул составляет (CH₂)ₖ, где k — натуральное число.</div><table class="theory-table"><thead><tr><th>Пара</th><th>Гомологи?</th><th>Почему</th></tr></thead><tbody><tr><td>Пропан и пентан</td><td><b>Да</b></td><td>Оба алканы, разница C₂H₄ = 2CH₂</td></tr><tr><td>Пропан и пентен</td><td><b>Нет</b></td><td>Алкан и алкен — разные классы</td></tr><tr><td>Бутен-1 и бутен-2</td><td><b>Нет</b></td><td>Одинаковый состав C₄H₈; это изомеры</td></tr><tr><td>Бутин-1 и бутадиен-1,3</td><td><b>Нет</b></td><td>Разные классы, хотя общая формула одинакова</td></tr></tbody></table><h3>Последовательность проверки</h3><ol><li>Определите класс каждого соединения.</li><li>Убедитесь, что классы совпадают.</li><li>Сравните молекулярные формулы. Если разница (CH₂)ₖ — это гомологи.</li></ol><div class="note">Один и тот же молекулярный состав не делает вещества гомологами. Гомологи должны отличаться составом!</div></div>`;
const theoryIso=`<div class="theory"><p><b>Изомеры</b> — вещества с одинаковой молекулярной формулой, но разным строением молекул (или пространственным расположением атомов). В основных заданиях рассмотрим <b>структурную изомерию</b>.</p><div class="keybox"><b>Пример.</b> Бутан <span class="chem inline">CH₃–CH₂–CH₂–CH₃</span> и 2-метилпропан <span class="chem inline">CH₃–CH(CH₃)–CH₃</span> имеют формулу C₄H₁₀, но различаются углеродным скелетом.</div><table class="theory-table"><thead><tr><th>Тип изомерии</th><th>Пример</th><th>Что изменилось?</th></tr></thead><tbody><tr><td><b>Углеродного скелета</b></td><td>Бутан / 2-метилпропан</td><td>Расположение атомов C в цепи</td></tr><tr><td><b>Положения двойной связи</b></td><td>Бутен-1 / бутен-2</td><td>Место связи C=C</td></tr><tr><td><b>Положения тройной связи</b></td><td>Бутин-1 / бутин-2</td><td>Место связи C≡C</td></tr><tr><td><b>Межклассовая</b></td><td>Бутин-1 / бутадиен-1,3</td><td>Разные классы при одной формуле C₄H₆</td></tr></tbody></table><h3>Не путайте четыре ситуации</h3><ul><li><b>Изомеры:</b> одинаковая молекулярная формула, разное строение.</li><li><b>Гомологи:</b> один класс, молекулярные формулы отличаются на (CH₂)ₖ.</li><li><b>Одно вещество:</b> формула просто записана в другом направлении.</li><li><b>Ни то ни другое:</b> не выполняется ни один из критериев.</li></ul><div class="note">Например, <span class="chem inline">CH₂=CH–CH₂–CH₃</span> и <span class="chem inline">CH₃–CH₂–CH=CH₂</span> — <b>одно и то же вещество</b>, бутен-1.</div></div>`;
const theoryNames=`<div class="theory"><p>Название по систематической номенклатуре показывает число атомов углерода, тип связи, её положение и расположение заместителей.</p><div class="keybox"><b>Как записываем названия в тренажёре:</b> номер кратной связи ставим в конце: <b>бутен-2, пентин-1, бутадиен-1,3</b>. Такое написание используется во всех заданиях и правильных ответах.</div><h3>Алгоритм названия по формуле</h3><ol><li>Выберите <b>самую длинную цепь, содержащую кратную связь</b> (если она есть).</li><li>Пронумеруйте цепь с конца, ближайшего к кратной связи. Для алканов выбирайте нумерацию с меньшими номерами заместителей.</li><li>Найдите боковые группы и их положения: метил-, этил- и т. д.</li><li>Укажите главную цепь, положение кратной связи и суффикс: <b>-ан, -ен, -ин, -диен</b>.</li></ol><table class="theory-table"><thead><tr><th>Структурная формула</th><th>Название</th></tr></thead><tbody><tr><td><span class="chem">CH₃–CH₂–CH₃</span></td><td>Пропан</td></tr><tr><td><span class="chem">CH₂=CH–CH₂–CH₃</span></td><td>Бутен-1</td></tr><tr><td><span class="chem">CH₃–C≡C–CH₃</span></td><td>Бутин-2</td></tr><tr><td><span class="chem">CH₂=CH–CH=CH₂</span></td><td>Бутадиен-1,3</td></tr><tr><td><span class="chem">CH₃–CH(CH₃)–CH₂–CH₃</span></td><td>2-метилбутан</td></tr></tbody></table><h3>Как записывать структурную формулу</h3><p>Для «3-метилпентена-1» запишите главную цепь из пяти атомов углерода, двойную связь между C₁ и C₂ и метильную группу у C₃:</p><div class="keybox" style="text-align:center"><span class="chem">CH₂=CH–CH(CH₃)–CH₂–CH₃</span></div><p>Тренажёр принимает сокращённые структурные формулы с дефисами или без них; для тройной связи используйте символ <b>≡</b> или обычный <b>#</b>. Формулу можно записать и в обратном направлении.</p><div class="note"><b>Важно:</b> молекулярная формула вида C₅H₁₂ здесь не заменяет структурную: она не показывает расположение связей и боковых групп.</div></div>`;

const classification={id:'class',title:'Классификация',number:'01',subtitle:'Находим класс по химическим связям',stages:[
 theoretical('Как распознать класс',theoryClass),
 flashStage('Узнаём по формуле','Сначала предположите класс, затем откройте ответ. Формулы идут от простых к более сложным.',[
  ['CH3-CH2-CH3','Алканы','Все связи между атомами углерода одинарные.'],['CH2=CH-CH3','Алкены','Одна двойная связь C=C.'],['CH#C-CH3','Алкины','Одна тройная связь C≡C.'],['CH2=CH-CH=CH2','Алкадиены','Две двойные связи C=C.'],['CH3-CH(CH3)-CH3','Алканы','Разветвлённый скелет, но все связи одинарные.'],['CH3-CH=CH-CH3','Алкены','Двойная связь находится внутри цепи.'],['CH3-C#C-CH3','Алкины','Тройная связь находится внутри цепи.'],['CH2=C(CH3)-CH=CH2','Алкадиены','Две двойные связи, есть боковая группа CH₃.'],['CH2=CH-CH2-CH=CH2','Алкадиены','Две двойные связи разделены группой –CH₂–.'],['CH3-CH2-CH2-CH3','Алканы','Четыре атома углерода, все связи одинарные.']
 ]),
 stage('Простые формулы','Выберите класс углеводорода. Один правильный ответ.',[
  single('К какому классу относится соединение?',CLASSES,'Алканы','В молекуле только одинарные связи C–C.',{formula:'CH3-CH3'}),
  single('К какому классу относится соединение?',CLASSES,'Алкены','Одна двойная связь C=C.',{formula:'CH2=CH2'}),
  single('К какому классу относится соединение?',CLASSES,'Алкины','Одна тройная связь C≡C.',{formula:'CH#CH'}),
  single('К какому классу относится соединение?',CLASSES,'Алкадиены','Две двойные связи C=C.',{formula:'CH2=CH-CH=CH2'}),
  single('Определите класс вещества.',CLASSES,'Алкины','Связь C≡C определяет принадлежность к алкинам.',{formula:'CH3-CH2-C#CH'}),
  single('Определите класс вещества.',CLASSES,'Алканы','В этой цепи нет кратных связей.',{formula:'CH3-CH2-CH2-CH2-CH3'}),
  single('Определите класс вещества.',CLASSES,'Алкены','Связь C=C одна, поэтому это алкен.',{formula:'CH3-CH2-CH=CH2'}),

// Молекулярно-графовая проверка сокращённых структурных формул.
// Корректные записи в противоположных направлениях имеют одинаковую каноническую форму.
function parseStructure(original){
 let str=String(original||'').trim().toUpperCase().replace(/[₀-₉]/g,x=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(x)).replace(/[\s\u200b]/g,'').replace(/[—–−]/g,'-').replace(/≡/g,'#').replace(/(^|[-=(#])H([0-9])C/g,'$1CH$2');
 if(!str)throw Error('Введите сокращённую структурную формулу.');
 if(/^C\d+H\d+$/i.test(str))throw Error('Нужна структурная формула (например, CH3-CH2-CH3), а не только молекулярная.');
 let i=0,last=null,bond=1,stack=[],nodes=[];
 while(i<str.length){
  const ch=str[i];
  if(ch==='-'||ch==='='||ch==='#'){
   if(last===null||bond!==1)throw Error('Проверьте расположение знаков химических связей.');
   bond=ch==='-'?1:ch==='='?2:3;i++;continue;
  }
  if(ch==='('){if(last===null||bond!==1)throw Error('Проверьте запись боковой группы.');stack.push(last);i++;continue;}
  if(ch===')'){if(!stack.length||bond!==1)throw Error('Проверьте скобки в формуле.');last=stack.pop();i++;continue;}
  if(ch!=='C')throw Error('Используйте сокращённую формулу из групп CH3, CH2, CH и C; связи - = ≡.');
  i++;let h=0;
  if(str[i]==='H'){i++;let digits='';while(i<str.length&&/[0-9]/.test(str[i]))digits+=str[i++];h=digits?Number(digits):1;}
  if(h>4)throw Error('Число атомов H при одном атоме C не может превышать 4.');
  const id=nodes.length;nodes.push({h,links:[]});
  if(last!==null){nodes[last].links.push([id,bond]);nodes[id].links.push([last,bond]);}
  last=id;bond=1;
  if(nodes.length>25)throw Error('Формула слишком длинная для этого тренажёра.');
 }
 if(stack.length||bond!==1)throw Error('Формула не завершена: проверьте связи и скобки.');
 if(nodes.length===0)throw Error('Введите структурную формулу.');
 for(const n of nodes){const val=n.links.reduce((sum,link)=>sum+link[1],n.h);if(val!==4)throw Error('Проверьте валентность углерода и количество атомов водорода в каждой группе.');}
 const walk=(node,parent)=>`H${nodes[node].h}[${nodes[node].links.filter(x=>x[0]!==parent).map(x=>`${x[1]}:${walk(x[0],node)}`).sort().join('|')}]`;
 const strings=nodes.map((_,j)=>walk(j,-1));strings.sort();return strings[0];
}
function normalizeName(s){
 const input=String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[—–−]/g,'-').replace(/\s+/g,'').replace(/\./g,'').replace(/[()]/g,'');
 // Во вводе альтернативное положение локанта преобразуем к принятой учебной форме.
 return input.replace(/([а-я]+)-(\d+(?:,\d+)*)-(диен|ен|ин)([а-я]*)/g,(_,stem,positions,suffix,ending)=>`${stem}${suffix}${ending}-${positions}`);
}
function sameName(q,answer){const candidates=[q.answer,...(nameAlternatives[q.answer.toLowerCase()]||[]),...(q.aliases||[])];return candidates.some(x=>normalizeName(x)===normalizeName(answer));}
function evaluate(q,response){
 if(q.type==='single'){return {points:response===q.answer?1:0,max:1};}
 if(q.type==='multiple'){const a=Array.isArray(response)?response:[];return {points:a.length===q.answer.length&&q.answer.every(x=>a.includes(x))?1:0,max:1};}
 if(q.type==='match'){const a=response||{};const right=q.answer.reduce((sum,v,i)=>sum+(a[i]===v?1:0),0);return {points:right,max:q.rows.length};}
 if(q.type==='input-name')return {points:sameName(q,response)?1:0,max:1};
 if(q.type==='input-formula'){

function questionFingerprint(q){
 const opts=q.type==='single'||q.type==='multiple'?q.options.slice().sort():q.options;

function randomSubset(stage, old=null, limit=16, preferUnseen=true){
 const target=Math.min(limit,stage.questions.length),last=new Set(old?.ids||[]),fingerprints=new Set();
 const buckets=[[],[],[],[]];
 for(const q of stage.questions){
  const repeat=last.has(q.id),seen=preferUnseen&&!!db.progress[q.id];
  buckets[(repeat?2:0)+(seen?1:0)].push(q);
 }
 const chosen=[],counts=new Map();
 for(const bucket of buckets){
  let candidates=shuffle(bucket);
  while(candidates.length&&chosen.length<target){
   candidates=candidates.filter(q=>!fingerprints.has(questionFingerprint(q)));
   if(!candidates.length)break;
   const singleAnswers=candidates.filter(q=>q.type==='single');
   let pool=candidates;
   if(singleAnswers.length && singleAnswers.length===candidates.length){
    const least=Math.min(...candidates.map(q=>counts.get(q.answer)||0));
    pool=candidates.filter(q=>(counts.get(q.answer)||0)===least);
   }
   const pick=pool[Math.floor(Math.random()*pool.length)];
   chosen.push(pick);fingerprints.add(questionFingerprint(pick));
   counts.set(pick.answer,(counts.get(pick.answer)||0)+1);
   candidates=candidates.filter(q=>q.id!==pick.id);
  }
  if(chosen.length===target)break;
 }

 // но их порядок и порядок ответов всё равно перемешиваются.
 if(chosen.length<target){

   if(chosen.length>=target)break;

}
function questionLayouts(questions){
 const layouts={};
 // Правильные позиции перемешаны и сбалансированы: нет постоянного «ответ Б».
 const groups=new Map();
 for(const q of questions){
  if(q.type==='single'&&q.options.includes(q.answer)){
   const k=q.options.length;
   if(!groups.has(k))groups.set(k,[]);
   groups.get(k).push(q);
  }
 }
 const targets={};
 for(const [k,group] of groups){
  const slots=shuffle(group.map((_,i)=>i%k));
  shuffle(group).forEach((q,i)=>targets[q.id]=slots[i]);
 }
 for(const q of questions){
  const options=shuffle(q.options||[]);
  if(Object.prototype.hasOwnProperty.call(targets,q.id)){
   const oldIndex=options.indexOf(q.answer),newIndex=targets[q.id];
   if(oldIndex>=0)[options[oldIndex],options[newIndex]]=[options[newIndex],options[oldIndex]];
  }
  layouts[q.id]={
   options,
   rows:q.type==='match'?shuffle(q.rows.map((_,i)=>i)):null,
   reversePair:!!q.pair&&Math.random()<0.5

 }

}

 }

 if(!sel.layouts){sel.layouts=questionLayouts(currentQuizQuestions());save();}
 if(!sel.layouts[q.id]){sel.layouts[q.id]=questionLayouts([q])[q.id];save();}

function examMix(questions){
 const shuffled=shuffle(questions),out=[];
 const byId=new Map(Object.entries(examPool).flatMap(([topic,list])=>list.map(q=>[q.id,topic])));
 while(shuffled.length){
  let candidates=shuffled;
  if(out.length>=2){
   const a=out[out.length-1],b=out[out.length-2];
   if(byId.get(a.id)===byId.get(b.id)){
    const alternating=candidates.filter(q=>byId.get(q.id)!==byId.get(a.id));
    if(alternating.length)candidates=alternating;
   }
  }

 html+=`<div class="match-grid">${(view.rows||q.rows.map((_,i)=>i)).map((original,position)=>{const left=q.rows[original],v=(response||{})[original]||'';const good=checked&&!exam&&v===q.answer[original];const bad=checked&&!exam&&!good;return `<div class="match-row ${good?'good':bad?'bad':''}"><div class="match-left"><span class="tag">${position+1}</span> ${pretty(left)}</div><select aria-label="Ответ для строки ${position+1}" onchange="chooseMatch(${original},this.value)" ${checked?'disabled':''}><option value="">Выберите соответствие…</option>${view.options.map((o,i)=>`<option value="${esc(o)}" ${v===o?'selected':''}>${hasFormulaOptions?'Вариант '+String.fromCharCode(1040+i):esc(o)}</option>`).join('')}</select></div>`}).join('')}</div><p class="helptext">Каждое правильное соответствие даёт один балл. Используйте каждый вариант не более одного раза.</p>`;
 }else{
  html+=`<label class="input-label" for="answerInput">${q.type==='input-name'?'Название по номенклатуре':'Сокращённая структурная формула'}</label><input id="answerInput" class="text-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.type==='input-name'?'Например: 2-метилбутан':'Например: CH3-CH(CH3)-CH3'}" value="${esc(response||'')}" oninput="typeAnswer(this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();${exam?'examNext()':'checkTraining()'}}" ${checked?'disabled':''}>${q.type==='input-formula'?'<div id="answerPreview" class="answer-preview"></div>':''}<p class="hint-line">${q.type==='input-name'?'Записывайте номер связи в конце: бутен-1, бутин-2, бутадиен-1,3.':'Скобки обозначают боковую ветвь (CH3). При вводе ниже отображается её положение; связи: -, = и # или ≡.'}</p>`;
 }
 if(checked&&!exam){const good=result.points===result.max;html+=`<div class="feedback ${good?'good':'bad'}" role="status"><strong>${good?'✓ Верно!':`✕ ${q.type==='match'?`Верных соответствий: ${result.points} из ${result.max}`:'Неверно'}`}</strong>${result.error?`<p>${esc(result.error)}</p>`:''}<p>${esc(q.explain)}</p>${!good?`<div class="answer">Правильный ответ: ${correctDisplay(q)}</div>`:''}</div>`;}
 return html;
}
function chooseOption(index){const q=state.mode==='exam'?examQuestion():questionAt();if(state.mode==='train'&&state.checked)return;const val=viewFor(q).options[index];let response=state.mode==='exam'?examResponse(q):state.response;if(q.type==='single')response=val;else{response=Array.isArray(response)?response.slice():[];response=response.includes(val)?response.filter(x=>x!==val):[...response,val];}
 if(state.mode==='exam'){db.exam.answers[q.id]=response;save();}else state.response=response;render();}
function chooseMatch(index,value){const q=state.mode==='exam'?examQuestion():questionAt();const response=state.mode==='exam'?{...examResponse(q)}:{...state.response};response[index]=value;if(state.mode==='exam'){db.exam.answers[q.id]=response;save();}else state.response=response;}
function typeAnswer(value){const q=state.mode==='exam'?examQuestion():questionAt();if(state.mode==='exam'){db.exam.answers[q.id]=value;save();}else state.response=value;if(q.type==='input-formula')showInputPreview(value);}
function showInputPreview(value){const el=document.getElementById('answerPreview');if(!el)return;try{if(!value.trim()){el.innerHTML='';return;}parseStructure(value);el.innerHTML='<strong>Как выглядит ваша запись:</strong>'+visualFormula(value);attachFormulaZoom();}catch{el.innerHTML='';}}
function checkTraining(){const q=questionAt();if(state.checked)return;if(!isAnswered(q,state.response)){const input=document.getElementById('answerInput');if(input)input.focus();else alert('Сначала выберите или введите ответ.');return;}state.checked=true;const result=evaluate(q,state.response);db.progress[q.id]={response:structuredCloneSafe(state.response),points:result.points,max:result.max,time:Date.now(),attempt:selectionForCurrent().attempt};save();render();}
function trainingNext(step){const s=topics[state.topic].stages[state.stage],questions=currentQuizQuestions();if(step<0){if(state.question>0){state.question--;resetTrainingQuestion();render();}else prevStage();return;}
 if(state.question<questions.length-1){state.question++;resetTrainingQuestion();render();}else nextStage();}
function retryTraining(){const q=questionAt();delete db.progress[q.id];save();state.response=blank(q);state.checked=false;render();}
function renderTrainingQuiz(){const t=topics[state.topic],s=t.stages[state.stage],q=questionAt(),n=currentQuizQuestions().length;const body=`<div class="top-progress"><span>Задание ${state.question+1} из ${n}</span><div class="bar"><span style="width:${100*(state.question+1)/n}%"></span></div></div>${questionView(q,state.response,state.checked,'train')}<div class="bank-info">Случайная подборка: ${n} заданий из банка ${s.questions.length}. Варианты ответов и соответствия перемешаны; новые подборки по возможности избегают повторов. В каталоге ${catalog.length} веществ.</div><div class="actions"><div class="actions-right"><button class="btn new-set" onclick="newQuizSelection()" title="Случайные задания из расширенного банка">↻ Новая подборка</button><button class="btn" onclick="trainingNext(-1)">← Назад</button></div><div class="actions-right">${state.checked?`<button class="btn" onclick="retryTraining()">Повторить</button><button class="btn primary" onclick="trainingNext(1)">${state.question===n-1?'Следующий этап →':'Следующее задание →'}</button>`:`<button class="btn primary" onclick="checkTraining()">Проверить ответ</button>`}</div></div>`;setPanel(trainingHead(t,s),body);if(q.type==='input-formula')showInputPreview(state.response||'');}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newExam(){
 const quotas={class:{single:2,multiple:2,match:2},hom:{single:2,multiple:2,match:2},iso:{single:3,multiple:2,match:1},name:{'input-name':3,'input-formula':3}};
 const previous=new Set(db.exam?.questions||[]);
 const chosen=topics.flatMap(t=>Object.entries(quotas[t.id]).flatMap(([type,n])=>{
  const pool=shuffle(examPool[t.id].filter(q=>q.type===type));
  return pool.filter(q=>!previous.has(q.id)).concat(pool.filter(q=>previous.has(q.id))).slice(0,n);
 }));
 const arranged=examMix(chosen);
 db.exam={status:'active',questions:arranged.map(q=>q.id),layouts:questionLayouts(arranged),answers:{},started:Date.now()};
 state.examIndex=0;state.showResults=false;save();render();}

function examQuestions(){if(!db.exam)return[];const lookup=Object.values(examPool).flat().reduce((o,q)=>(o[q.id]=q,o),{});return db.exam.questions.map(id=>lookup[id]).filter(Boolean);}
function examQuestion(){return examQuestions()[state.examIndex];}
function examResponse(q){return db.exam.answers[q.id]??blank(q);}
function examNext(){if(!db.exam||db.exam.status!=='active')return;const questions=examQuestions();if(state.examIndex<questions.length-1){state.examIndex++;render();}else submitExam();}
function examPrev(){state.examIndex=Math.max(0,state.examIndex-1);render();}
function examJump(i){state.examIndex=i;render();}
function submitExam(){const e=db.exam;if(!e||e.status!=='active')return;const qs=examQuestions();const unanswered=qs.filter(q=>!isAnswered(q,e.answers[q.id])).length;
 if(unanswered&&!confirm(`Осталось заданий без ответа: ${unanswered}. Завершить контрольную?`))return;
 if(!unanswered&&!confirm('Завершить контрольную работу и получить оценку?'))return;
 let points=0,max=0;const detail={};for(const q of qs){const r=evaluate(q,e.answers[q.id]??blank(q));points+=r.points;max+=r.max;detail[q.id]=r;}
 const pct=max?Math.round(points/max*100):0;const grade=pct>=90?5:pct>=70?4:pct>=50?3:2;e.status='completed';e.finished=Date.now();e.points=points;e.max=max;e.pct=pct;e.grade=grade;e.detail=detail;db.history.unshift({finished:e.finished,pct,grade,points,max});db.history=db.history.slice(0,10);save();state.showResults=true;render();scrollToPanel();
}
function renderExamIntro(){const active=db.exam?.status==='active',completed=db.exam?.status==='completed';const last=db.history[0];setPanel(`<div class="stage-label">ИТОГОВАЯ РАБОТА</div><h2>Контрольная по углеводородам</h2><p>Четыре раздела, задания разных форматов. Итоговая оценка после сдачи.</p>`,`<div class="exam-intro"><h3 style="font-size:1.3rem;margin-top:0">Проверьте, насколько хорошо вы освоили тему</h3><p>В контрольную случайным образом попадают задания по классификации углеводородов, гомологии, изомерии и номенклатуре. В каждом разделе — шесть заданий.</p><div class="exam-stats"><div class="stat"><strong>24</strong><span>задания</span></div><div class="stat"><strong>4</strong><span>раздела</span></div><div class="stat"><strong>1–4</strong><span>балла за задание*</span></div></div><div class="note">* В заданиях на соответствие каждый правильный ответ оценивается отдельно. В остальных заданиях один балл начисляется только за полностью правильный ответ.</div><div class="theory"><h3>Шкала оценивания</h3><p>0–49% — «2» · 50–69% — «3» · 70–89% — «4» · 90–100% — «5».</p><p><b>Во время работы</b> подсказок и мгновенной проверки нет. Порядок вопросов и вариантов ответа перемешивается для каждой попытки, а вопросы предыдущей работы по возможности не повторяются. После сдачи доступен разбор ошибок.</p></div>${last?`<div class="keybox"><b>Предыдущий результат:</b> ${last.pct}% — оценка «${last.grade}».</div>`:''}<div class="actions"><span class="tag">Ответы сохраняются на этом устройстве</span><div class="actions-right">${active?'<button class="btn" onclick="renderExamQuestion()">Продолжить начатую</button>':completed?'<button class="btn" onclick="state.showResults=true;render()">Посмотреть прошлый результат</button>':''}<button class="btn primary" onclick="${active?'confirmNewExam()':'newExam()'}">${active?'Начать заново':'Начать контрольную →'}</button></div></div></div>`);}
function confirmNewExam(){if(confirm('Текущая попытка будет заменена новой. Продолжить?'))newExam();}
function renderExamQuestion(){const qs=examQuestions();const q=qs[state.examIndex];if(!q){delete db.exam;save();renderExamIntro();return;}const completed=qs.filter(x=>isAnswered(x,db.exam.answers[x.id])).length;const nav=`<div class="exam-map">${qs.map((x,i)=>`<button type="button" class="${isAnswered(x,db.exam.answers[x.id])?'done':''} ${state.examIndex===i?'current':''}" onclick="examJump(${i})" title="Задание ${i+1}" aria-label="Перейти к заданию ${i+1}">${i+1}</button>`).join('')}</div>`;
 const topic=topics.find(t=>examPool[t.id].includes(q));const body=`<div class="top-progress"><span>Вопрос ${state.examIndex+1} из ${qs.length} · Отвечено: ${completed}</span><div class="bar"><span style="width:${100*completed/qs.length}%"></span></div></div>${nav}${questionView(q,examResponse(q),false,'exam')}<div class="actions"><button class="btn" onclick="examPrev()" ${state.examIndex===0?'disabled':''}>← Предыдущее</button><div class="actions-right"><button class="btn warn" onclick="submitExam()">Завершить работу</button><button class="btn primary" onclick="examNext()">${state.examIndex===qs.length-1?'Сдать работу':'Следующее →'}</button></div></div>`;
 setPanel(`<div class="stage-label">КОНТРОЛЬНАЯ <span style="color:#c1cbd5">/</span> ${esc(topic?.title||'')}</div><h2>Задание ${state.examIndex+1}</h2><p>Ответы можно изменять до сдачи работы. Правильные ответы появятся после проверки.</p>`,body);}
function renderResults(){const e=db.exam;if(!e||e.status!=='completed'){renderExamIntro();return;}const qs=examQuestions();const pct=e.pct;const rstats=topics.map(t=>{let total=0,points=0;for(const q of qs.filter(q=>examPool[t.id].includes(q))){total+=(e.detail[q.id]?.max||1);points+=(e.detail[q.id]?.points||0);}return {name:t.title,points,total};});
 const list=qs.map((q,i)=>{const result=e.detail[q.id]||{points:0,max:1};const good=result.points===result.max;const response=e.answers[q.id]??blank(q);return `<details class="review ${good?'good':'bad'}"><summary><span style="color:${good?'var(--green)':'var(--red)'}">${good?'✓':'✕'}</span><span>№${i+1}. ${esc(q.prompt)} <small style="color:var(--muted)">(${result.points}/${result.max})</small></span></summary><div class="review-body">${showFormulas(q)}<p><b>Ваш ответ:</b> ${pretty(responseText(q,response))}</p><p><b>Правильный ответ:</b> ${correctDisplay(q)}</p><p>${esc(q.explain)}</p></div></details>`}).join('');
 setPanel(`<div class="stage-label">КОНТРОЛЬНАЯ ЗАВЕРШЕНА</div><h2>Результаты и разбор</h2><p>Работа проверена. Ниже можно разобрать каждое задание и увидеть допущенные ошибки.</p>`,`<div class="result-hero"><div class="result-circle" style="border-color:${pct>=70?'#aadbd1':pct>=50?'#f2d5a4':'#efb9b9'}"><strong>${pct}%</strong><span>${e.points} из ${e.max} баллов</span></div><div class="grade">Оценка «${e.grade}»</div><p style="color:var(--muted)">Итог по шкале: 50% / 70% / 90%</p></div><h3 style="margin-top:18px">Результаты по разделам</h3><div class="section-breakdown">${rstats.map(x=>`<div class="breakdown"><strong>${esc(x.name)}</strong><small>${x.points} из ${x.total} баллов</small><div class="mini-progress"><i style="width:${x.total?x.points/x.total*100:0}%"></i></div></div>`).join('')}</div><h3>Разбор всех заданий</h3><p style="font-size:.85rem;color:var(--muted)">Нажмите на строку задания, чтобы посмотреть свой ответ и объяснение.</p>${list}<div class="actions"><button class="btn" onclick="window.print()">Распечатать результат</button><div class="actions-right"><button class="btn" onclick="state.showResults=false;render()">К началу контрольной</button><button class="btn primary" onclick="newExam()">Новая попытка →</button></div></div>`);}
function render(){renderHeader();renderOverview();renderSidebar();if(state.mode==='exam'){
 if(state.showResults&&db.exam?.status==='completed'){renderResults();return;}
 if(db.exam?.status==='active'){renderExamQuestion();return;}
 renderExamIntro();return;
 }
 const s=topics[state.topic].stages[state.stage];if(s.kind==='theory')renderTheory();else if(s.kind==='flash')renderFlash();else renderTrainingQuiz();
}
document.getElementById('trainTab').addEventListener('click',()=>showMode('train'));
document.getElementById('examTab').addEventListener('click',()=>showMode('exam'));
// Для автоматизированной самопроверки и последующей доработки в консоли.
window.chemTrainer={topics,examPool,parseStructure,evaluate,normalizeName,catalog,drawStructure,cHom,cSimilar};
render();
</script>
</body>
</html>
